<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061127"><meta name="description" content="WEDLETTER — Midnight Sapphire, свадебная сцена"><title>Аурелия и Себастьян — Midnight Sapphire | WEDLETTER</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#061025}body{overflow-x:hidden;color:#fff}html{scroll-behavior:smooth}
.stage{position:relative;width:100%;height:100svh;height:100dvh;overflow:hidden;background:#070d1d;isolation:isolate}
.art{position:absolute;inset:0;background:#070d1d url("../velvet-sapphire/assets/sapphire.jpg") center/cover no-repeat;transform:translateZ(0);}

.stage-light{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.17;background:radial-gradient(ellipse 35% 38% at 58% 58%,rgba(255,220,156,.13),transparent 80%);animation:light-breathe 9s ease-in-out 5s infinite alternate}
@keyframes light-breathe{to{opacity:.34}}

.stars{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.star{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);border-radius:50%;background:#ffedc8;animation:twinkle var(--t) ease-in-out var(--delay) infinite alternate}
@keyframes twinkle{0%{opacity:.16}50%{opacity:.95}100%{opacity:.3}}
.veil{position:absolute;inset:0;z-index:4;pointer-events:none;background:#08162f;opacity:1;animation:veil-fade 4.45s ease-out .1s both}
@keyframes veil-fade{0%,27%{opacity:1}100%{opacity:0}}
.intro{position:absolute;inset:0;z-index:5;pointer-events:none;background-image:url("../velvet-sapphire/assets/glitter.webp");background-repeat:no-repeat;background-size:100% 100%;opacity:1;animation:intro-fade 4.4s ease-out .1s both}
@keyframes intro-fade{0%,28%{opacity:1}100%{opacity:0}}
/* Lively but mobile-safe glints over pre-rendered dense dust. */
.intro-glints{position:absolute;inset:0;pointer-events:none}
.intro-glint{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);border-radius:50%;background:#fff5d9;opacity:.2;box-shadow:0 0 5px 1px #ffdd9e88;animation:glint var(--t) ease-in-out var(--delay) infinite}
.intro-glint:nth-child(5n){background:#fff;box-shadow:0 0 9px 2px #ffe3a0aa}
@keyframes glint{0%,100%{opacity:.09}45%{opacity:1}65%{opacity:.32}}
.intro::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.32;background:radial-gradient(ellipse at 24% 32%,#ffeab433,transparent 46%),radial-gradient(ellipse at 78% 63%,#ffdf9c35,transparent 42%);animation:glint-wash 1.8s ease-in-out infinite alternate}
@keyframes glint-wash{from{opacity:.13}to{opacity:.6}}

.replay{position:absolute;z-index:8;right:calc(16px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));height:44px;width:44px;display:grid;place-items:center;border-radius:50%;border:1px solid #e8d5bd88;background:#09142999;color:#f7e9d4;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.replay svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stage.restart .veil,.stage.restart .intro{animation:none!important}
@media(min-aspect-ratio:10/14){.art{background-size:contain;background-color:#071023}}
@media(prefers-reduced-motion:reduce){.veil,.intro{display:none}.art,.star,.stage-light,.intro-glint{animation:none}}

/* SECOND SCENE: Midnight Sapphire / floating silk / ivory calendar. */
.silk-scene{position:relative;min-height:112svh;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:0;padding:clamp(88px,12vh,125px) 18px 110px;background:#030a1b;color:#f5e9d6}
.silk-scene::before{content:"";position:absolute;inset:-13%;z-index:-2;background:#06132d url("assets/silk.jpg") center center/cover no-repeat;transform:translate3d(0,0,0) scale(1.08);animation:silk-drift 14s ease-in-out infinite alternate;will-change:transform}
@keyframes silk-drift{0%{transform:translate3d(-1%,2%,0) scale(1.08)}100%{transform:translate3d(1%,-2%,0) scale(1.15)}}
.silk-sheen{position:absolute;inset:0;pointer-events:none;z-index:-1;background:linear-gradient(155deg,transparent 15%,#d6c3a611 32%,transparent 49%,#fbdbb219 59%,transparent 71%),radial-gradient(ellipse at 50% 35%,#c8ad7612,transparent 65%)}
.silk-twist{opacity:.42;position:absolute;top:-7vw;left:-20%;width:145%;height:45vh;transform:rotate(-9deg);pointer-events:none;border-radius:0 0 50% 50%;background:linear-gradient(167deg,#080f26 6%,#14264a 23%,#435778 31%,#182844 39%,#09142e 52%,#030819 69%);box-shadow:0 22px 45px #020618aa,inset 0 -12px 35px #6d85aa34;z-index:-1;animation:fold-sway 19s ease-in-out infinite alternate}
@keyframes fold-sway{to{transform:rotate(-6deg) translate3d(1%,-2%,0)}}
.silk-scene::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;box-shadow:inset 0 50px 90px #03071670,inset 0 -50px 95px #03071670}
.silk-lead{font-family:Georgia,serif;font-size:clamp(46px,11vw,86px);font-weight:400;font-style:italic;line-height:1.05;text-align:center;letter-spacing:-.06em;margin:0 0 8px;color:#fff6e6;text-shadow:0 8px 24px #0008}
.silk-sub{margin:5px 0 27px;text-align:center;font:400 10px/1.6 system-ui,-apple-system,sans-serif;letter-spacing:.29em;text-transform:uppercase;color:#d4b98c}
.calendar-scene{position:relative;width:min(360px,calc(100vw - 62px));padding:12px 11px 15px;background:linear-gradient(140deg,#061026,#121e34 48%,#061024);border:1px solid #c9a98078;box-shadow:0 24px 70px #000a,0 0 48px #efcda40f}
.calendar-scene:before{content:"А · С";display:block;text-align:center;color:#d3b78d;letter-spacing:.43em;font:10px/24px Georgia,serif;height:28px}
.cal-paper{background:linear-gradient(157deg,#fffef8,#f0e9df 73%,#fffef9);color:#302137;min-height:390px;padding:31px 24px 28px;box-shadow:inset 0 2px 8px #ab936e26,0 10px 14px #0004}
.cal-month{text-align:center;font:400 clamp(37px,10vw,46px)/1.1 Georgia,serif;letter-spacing:.075em;color:#1a2643;margin:5px 0 4px}
.cal-year{text-align:center;font:600 10px/1.8 system-ui,-apple-system,sans-serif;letter-spacing:.49em;color:#a18860;margin:0 0 31px}
.cal-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px 0;align-items:center;text-align:center}
.cal-days span{font:400 11px/27px Georgia,serif;height:27px;min-width:0}
.cal-days .dow{color:#a58f73;font:600 9px/27px system-ui,-apple-system,sans-serif}
.cal-days .chosen{background:#162d57;color:#fffaf0;border-radius:50%;box-shadow:0 0 0 2px #d6b57c90;aspect-ratio:1;justify-self:center;width:27px}
.calendar-note{text-align:center;margin:18px 0 0;font:italic 19px/1.4 Georgia,serif;color:#293451}
.pearls{position:absolute;left:-37px;bottom:-55px;width:68px;height:130px;z-index:1;transform:rotate(15deg);filter:drop-shadow(0 3px 4px #0007)}
.pearls:before,.pearls:after{content:"";position:absolute;border:6px dotted #f3e9de;border-radius:55% 45% 60% 40%;width:38px;height:75px;left:15px;top:2px;transform:rotate(-18deg)}
.pearls:after{width:38px;height:61px;top:59px;left:2px;transform:rotate(25deg)}
.silk-date{margin-top:30px;text-align:center;font:italic 18px/1.3 Georgia,serif;color:#e8d7bd}
.silk-transition{height:118px;margin-top:-1px;position:relative;z-index:1;background:linear-gradient(180deg,#030a1b,#07152d);overflow:hidden}
.silk-transition:after{content:"";position:absolute;inset:-25px -15% 24px;border-radius:50%;background:linear-gradient(155deg,#020715,#1c2d56 46%,#050d21 67%);transform:rotate(4deg);box-shadow:0 12px 24px #0008,inset 0 -1px 4px #d0ab6c43}
.reveal-silk{opacity:0;transform:translate3d(0,28px,0);transition:opacity 1.15s ease,transform 1.15s cubic-bezier(.2,.8,.2,1)}
.reveal-silk.visible{opacity:1;transform:none}
@media(max-width:380px){.calendar-scene{width:calc(100vw - 64px)}.cal-paper{padding:25px 17px;min-height:370px}.cal-days{gap:5px 0}}
@media(prefers-reduced-motion:reduce){.silk-scene::before,.silk-twist{animation:none}.reveal-silk{opacity:1;transform:none;transition:none}}
</style></head><body><main class="stage" id="stage" aria-label="Свадебная сцена Аурелии и Себастьяна в сапфировых оттенках"><div class="art" role="img" aria-label="Аурелия и Себастьян на сцене под золотыми лучами"></div><div class="stage-light" aria-hidden="true"></div><div class="stars" id="stars" aria-hidden="true"></div><div class="veil" aria-hidden="true"></div><div class="intro" id="intro" aria-hidden="true"><div class="intro-glints" id="intro-glints"></div></div><button class="replay" id="replay" type="button" aria-label="Повторить мерцающее вступление"><svg viewBox="0 0 24 24"><path d="M3.7 10a8.3 8.3 0 1 1 .8 6M3 4v6h6"/></svg></button>
</main><div class="silk-transition" aria-hidden="true"></div>
<section class="silk-scene" id="calendar" aria-label="Свадебный календарь">
<div class="silk-sheen" aria-hidden="true"></div><div class="silk-twist" aria-hidden="true"></div>
<h2 class="silk-lead reveal-silk">Сохраните дату</h2>
<p class="silk-sub reveal-silk">День, с которого начинается наша история</p>
<div class="calendar-scene reveal-silk" aria-label="Календарь на июнь 2027 года, выделено 12 июня">
<div class="cal-paper"><h3 class="cal-month">Июнь</h3><div class="cal-year">2027</div><div class="cal-days" id="cal-days"></div><p class="calendar-note">Ждём вас в этот день</p></div>
<div class="pearls" aria-hidden="true"></div></div><div class="silk-date reveal-silk">12 июня 2027 года</div>
</section>
<script>(()=>{'use strict';
const stars=document.getElementById('stars');const frag=document.createDocumentFragment();
let seed=2941;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
for(let i=0;i<24;i++){const n=document.createElement('i');n.className='star';n.style.setProperty('--x',(rand()*100).toFixed(2)+'%');n.style.setProperty('--y',(rand()*100).toFixed(2)+'%');n.style.setProperty('--s',(1+rand()*2).toFixed(2)+'px');n.style.setProperty('--t',(2+rand()*2).toFixed(2)+'s');n.style.setProperty('--delay',(-rand()*4).toFixed(2)+'s');frag.appendChild(n)}stars.appendChild(frag);
const glints=document.getElementById('intro-glints'),particles=document.createDocumentFragment();
for(let i=0;i<72;i++){const e=document.createElement('i');e.className='intro-glint';
e.style.setProperty('--x',(rand()*100).toFixed(2)+'%');
e.style.setProperty('--y',(rand()*100).toFixed(2)+'%');
e.style.setProperty('--s',(1.5+rand()*2.9).toFixed(2)+'px');
e.style.setProperty('--t',(1.1+rand()*1.9).toFixed(2)+'s');
e.style.setProperty('--delay',(-rand()*3).toFixed(2)+'s');
particles.appendChild(e)}glints.appendChild(particles);
document.getElementById('intro').addEventListener('animationend',e=>{if(e.animationName==='intro-fade'){glints.replaceChildren();document.getElementById('intro').style.visibility='hidden'}});

const stage=document.getElementById('stage');document.getElementById('replay').addEventListener('click',()=>{stage.classList.add('restart');document.getElementById('intro').style.visibility='visible';if(!glints.children.length){for(let i=0;i<72;i++){const e=document.createElement('i');e.className='intro-glint';e.style.setProperty('--x',(rand()*100).toFixed(2)+'%');e.style.setProperty('--y',(rand()*100).toFixed(2)+'%');e.style.setProperty('--s',(1.5+rand()*2.9).toFixed(2)+'px');e.style.setProperty('--t',(1.1+rand()*1.9).toFixed(2)+'s');e.style.setProperty('--delay',(-rand()*3).toFixed(2)+'s');glints.appendChild(e)}}void stage.offsetWidth;stage.classList.remove('restart')});

if('scrollRestoration' in history)history.scrollRestoration='manual';if(!location.hash){window.scrollTo(0,0);window.addEventListener('pageshow',()=>window.scrollTo(0,0),{once:true})}
const calendar=document.getElementById('cal-days');for(const d of ['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС']){const el=document.createElement('span');el.className='dow';el.textContent=d;calendar.appendChild(el)}
const first=(new Date(2027,5,1).getDay()+6)%7;
for(let i=0;i<first;i++)calendar.appendChild(document.createElement('span'));
for(let n=1;n<=30;n++){const el=document.createElement('span');el.textContent=n;if(n===12)el.className='chosen';calendar.appendChild(el)}
const revealObs=new IntersectionObserver(es=>{for(const e of es){if(e.isIntersecting){e.target.classList.add('visible');revealObs.unobserve(e.target)}}},{threshold:.12});
document.querySelectorAll('.reveal-silk').forEach(el=>revealObs.observe(el));
})();</script></body></html>
