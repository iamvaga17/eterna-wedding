<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>WEDLETTER · Тест RSVP</title><style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f6f1ea;color:#322b25;font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:580px;margin:auto;padding:42px 18px 80px}header{margin-bottom:32px;border-bottom:1px solid #ded4c9;padding-bottom:22px}h1{font:400 38px Georgia,serif;margin:0}h2{font:400 30px Georgia,serif;margin:6px 0 14px}.sub{color:#877d70;font-size:14px}.card{background:#fffdfa;border:1px solid #e2d7c9;border-radius:18px;padding:24px}label{display:block;margin:17px 0 7px;font-weight:600}input[type=text],select{border:1px solid #cbbdae;background:#fff;width:100%;padding:13px;border-radius:10px;font:inherit}fieldset{border:0;padding:0;margin:18px 0}legend{font-weight:600;margin-bottom:12px}.option{display:flex;gap:10px;align-items:center;margin:10px 0}.option input{width:18px;height:18px}button{background:#302923;color:white;padding:14px 20px;border:0;border-radius:10px;width:100%;font:600 16px system-ui;cursor:pointer;margin-top:15px}button:disabled{opacity:.6}#result{margin-top:14px;white-space:pre-wrap}#result.error{color:#9d2d22}a{color:inherit}
</style></head><body><main class="wrap"><header><h1>WEDLETTER</h1><div class="sub">Тестирование системы RSVP · не для реальных гостей</div></header>
<section class="card"><h2>Подтверждение присутствия</h2><p class="sub">Проверяем сохранение ответа в тестовой свадьбе <strong>rsvp-test-wedletter</strong>.</p>
<form id="form">
<label for="name">Имя гостя</label><input id="name" name="name" type="text" maxlength="120" required autocomplete="name" placeholder="Например, Тестовый Гость">
<fieldset><legend>Ты придёшь на свадьбу?</legend>
<label class="option"><input type="radio" name="attendance" value="yes" checked> Да, приду</label>
<label class="option"><input type="radio" name="attendance" value="no"> Нет, не смогу</label></fieldset>
<label for="drink">Предпочтение по напиткам (необязательно)</label>
<select id="drink"><option value="">Не выбрано</option><option>Шампанское</option><option>Вино</option><option>Безалкогольные напитки</option></select>
<button id="send" type="submit">Отправить тестовый ответ</button>
<div id="result" aria-live="polite" role="status"></div></form>
</section><p class="sub">После успешной отправки открой кабинет и обнови страницу, чтобы увидеть новый ответ.</p></main>
<script>
(function(){
'use strict';
const form=document.getElementById('form'),btn=document.getElementById('send'),out=document.getElementById('result');
let lastFingerprint='',lastID='';
form.addEventListener('submit',async e=>{
e.preventDefault();
const name=document.getElementById('name').value.trim();
if(!name)return;
const attendance=form.querySelector('input[name=attendance]:checked').value;
const drink=document.getElementById('drink').value;
const details=drink?[{id:'drink',title:'Напитки',value:drink}]:[];
const content={name,attendance,details};
const fp=JSON.stringify(content);
if(fp!==lastFingerprint){lastFingerprint=fp;lastID=crypto.randomUUID();}
const payload={...content,id:lastID,slug:'rsvp-test-wedletter'};
const endpoint='/api/rsvp.php?slug=rsvp-test-wedletter';
btn.disabled=true;out.className='';out.textContent='Отправляем ответ…';
const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),15000);
try {
const response=await fetch(endpoint,{method:'POST',credentials:'omit',cache:'no-store',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(payload),signal:ctrl.signal});
const raw=await response.text();let result;try{result=JSON.parse(raw);}catch{}
if(response.ok&&result?.ok===true&&result?.id===lastID) {
  out.textContent='Ответ сохранён! Теперь открой кабинет WEDLETTER и обнови страницу.';
}else{
  out.className='error';out.textContent='Сервер не подтвердил сохранение (HTTP '+response.status+'). '+(result?.error||result?.code||result?.message||'Проверь настройки RSVP на сервере.');
}
}catch(e){out.className='error';out.textContent='Не удалось подтвердить сохранение. Проверь подключение и повтори попытку.';}
finally{clearTimeout(timer);btn.disabled=false;}
});
})();
</script></body></html>
