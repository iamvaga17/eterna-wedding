<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#171411">
<title>ÉTERNA 11.7 — Luxe Motion Preview</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171411}
#preview{position:fixed;inset:0;width:100%;height:100dvh;border:0;background:#171411}
</style>
</head>
<body>
<iframe id="preview" title="ÉTERNA 11.7" allow="fullscreen"></iframe>
<script>
(()=>{
 'use strict';
 const stamp = new URLSearchParams(location.search).get('refresh') || new URLSearchParams(location.search).get('v') || '117';
 const frame = document.getElementById('preview');
 frame.addEventListener('load',()=>{
   try{
     const doc=frame.contentDocument;
     if(!doc || !doc.head || !doc.body) return;
     const css=['eterna-11-3.css','eterna-11-4.css','eterna-11-5.css','eterna-11-6.css','eterna-11-7.css'];
     const js=['eterna-11-3.js','eterna-11-5.js','eterna-11-6.js','eterna-11-7.js'];
     css.forEach((file,i)=>{
       const id='eterna-css-'+i;
       if(doc.getElementById(id)) return;
       const el=doc.createElement('link');
       el.id=id; el.rel='stylesheet'; el.href=file+'?refresh='+encodeURIComponent(stamp);
       doc.head.appendChild(el);
     });
     js.forEach((file,i)=>{
       const id='eterna-js-'+i;
       if(doc.getElementById(id)) return;
       const el=doc.createElement('script');
       el.id=id; el.src=file+'?refresh='+encodeURIComponent(stamp);
       doc.body.appendChild(el);
     });
     doc.title='ÉTERNA 11.7 — Luxe Motion';
   }catch(error){console.warn('ÉTERNA preview:',error)}
 });
 frame.src='templates/eterna-v11.html?refresh='+encodeURIComponent(stamp);
})();
</script>
</body>
</html>
