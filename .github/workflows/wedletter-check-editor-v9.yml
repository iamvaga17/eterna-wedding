name: WEDLETTER | Check editor v9 key memory
on:
  push:
    branches: [main]
    paths:
      - 'editor-unified-spaceweb-v9.html'
      - '.github/workflows/wedletter-check-editor-v9.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate editor scripts and temporary key handling
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('editor-unified-spaceweb-v9.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s,re.I)
          assert scripts
          Path('/tmp/wedletter-editor-v9.js').write_text('\n'.join(scripts))
          assert "sessionStorage.setItem(TEMP_KEY_NAME,input.value)" in s
          assert "sessionStorage.removeItem(TEMP_KEY_NAME)" in s
          assert "localStorage.setItem(TEMP_KEY_NAME" not in s
          assert "remember.addEventListener('change',syncKey)" in s
          assert "forget.addEventListener('click'" in s
          assert 'renderShareLinks(p,slug)' in s
          PY
          node --check /tmp/wedletter-editor-v9.js
