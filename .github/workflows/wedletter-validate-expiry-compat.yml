name: WEDLETTER | Validate expiry compatibility release

on:
  push:
    branches: [main]
    paths:
      - 'spaceweb-api-release/expiry.php'
      - 'editor-unified-spaceweb-v53.html'
      - '.github/workflows/wedletter-validate-expiry-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate reviewed expiry PHP and editor scripts
        run: |
          set -euo pipefail
          php -l spaceweb-api-release/expiry.php
          python3 - <<'PY'
          from pathlib import Path
          import re
          source=Path('spaceweb-api-release/expiry.php').read_text()
          assert "gate-internal.php" in source
          assert "expires_on" in source
          assert "is_link($legacyDateFile)" in source
          assert "if($action==='status')" in source
          assert "atomic($legacyDateFile" in source
          assert "gateInstalled'=>true" in source
          assert "rsvpProtected'=>false" in source
          editor=Path('editor-unified-spaceweb-v53.html').read_text()
          assert "async function checkSpaceWebExpiry" in editor
          assert "async function applySpaceWebExpiry" in editor
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',editor,re.I)
          assert scripts
          Path('/tmp/wedletter-expiry-editor.js').write_text('\n'.join(scripts))
          print('Expiry v3 safety and editor integration assertions passed.')
          PY
          node --check /tmp/wedletter-expiry-editor.js
