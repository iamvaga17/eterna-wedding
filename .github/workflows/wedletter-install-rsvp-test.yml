name: WEDLETTER | Install isolated RSVP test page

on:
  push:
    branches: [main]
    paths:
      - 'spaceweb-rsvp-test/rsvp-test.html'
      - '.github/workflows/wedletter-install-rsvp-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wedletter-spaceweb-api
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify test page scope and install only this HTML file
        env:
          FTP_USER: ${{ secrets.SPACEWEB_API_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SPACEWEB_API_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_USER" && test -n "$FTP_PASSWORD"
          grep -q 'rsvp-test-wedletter' spaceweb-rsvp-test/rsvp-test.html
          grep -q '/api/rsvp.php' spaceweb-rsvp-test/rsvp-test.html
          echo "77.222.40.70 vh404.sweb.ru" | sudo tee -a /etc/hosts >/dev/null
          python3 - <<'PY'
          import ftplib
          import hashlib
          import io
          import os
          import ssl

          target='wedletter-rsvp-test.html'
          source=open('spaceweb-rsvp-test/rsvp-test.html','rb').read()
          if not source or len(source)>60000:
              raise RuntimeError('Unexpected test page size')
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=20)
          ftp.connect('vh404.sweb.ru',21)
          ftp.login(os.environ['FTP_USER'],os.environ['FTP_PASSWORD'])
          ftp.prot_p()
          previous=None
          try:
              chunks=[]
              try:
                  ftp.retrbinary('RETR '+target,chunks.append)
                  previous=b''.join(chunks)
              except ftplib.error_perm as e:
                  if not str(e).startswith('550'):raise
              try:
                  ftp.storbinary('STOR '+target,io.BytesIO(source))
                  check=[]
                  ftp.retrbinary('RETR '+target,check.append)
                  if hashlib.sha256(b''.join(check)).digest()!=hashlib.sha256(source).digest():
                      raise RuntimeError('Readback hash mismatch')
                  print('Test page installed; no PHP files or wedding pages changed.')
              except Exception:
                  if previous is not None:
                      try:ftp.storbinary('STOR '+target,io.BytesIO(previous))
                      except Exception: print('::error::Rollback of HTML test page failed')
                  else:
                      try:ftp.delete(target)
                      except Exception:print('::error::Removal of broken HTML test page failed')
                  raise
          finally:
              try:ftp.quit()
              except Exception:ftp.close()
          PY
