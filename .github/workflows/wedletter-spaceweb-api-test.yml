name: WEDLETTER | Verify API FTPS account

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wedletter-spaceweb-api
  cancel-in-progress: false

jobs:
  verify-api-access:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check isolated API credentials exist
        env:
          FTP_USER: ${{ secrets.SPACEWEB_API_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SPACEWEB_API_FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_USER" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Set SPACEWEB_API_FTP_USER and SPACEWEB_API_FTP_PASSWORD"
            exit 1
          fi
          if [ "$FTP_USER" = "wedletteru" ] || [ "$FTP_USER" = "wedletteru_deploy" ]; then
            echo "::error::Use a dedicated API-restricted account, not the main or staging account."
            exit 1
          fi

      - name: Install secure FTPS client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Verify access without modifying production files
        env:
          FTP_USER: ${{ secrets.SPACEWEB_API_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SPACEWEB_API_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          # Identical hostname/certificate arrangement verified for the isolated deploy user.
          echo "77.222.40.70 vh404.sweb.ru" | sudo tee -a /etc/hosts >/dev/null
          printf 'WEDLETTER API account secure FTPS test.\n' > wedletter-api-ftps-check.txt
          lftp -u "$FTP_USER","$FTP_PASSWORD" ftp://vh404.sweb.ru <<'LFTP'
          set cmd:fail-exit yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          set net:max-retries 1
          set net:timeout 15
          put wedletter-api-ftps-check.txt
          rm wedletter-api-ftps-check.txt
          bye
          LFTP
          echo "Verified isolated API directory access; marker removed. No PHP files changed."
