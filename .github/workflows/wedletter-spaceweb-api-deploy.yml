name: WEDLETTER | Deploy single API PHP file

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Only rsvp.php is initially allowed"
        required: true
        type: choice
        options: [rsvp.php]
      confirmation:
        description: "Type DEPLOY API to authorize changing the live API"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wedletter-spaceweb-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require explicit approval
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          TARGET: ${{ inputs.target }}
        run: |
          test "$CONFIRMATION" = 'DEPLOY API' || { echo "::error::Confirmation missing"; exit 1; }
          test "$TARGET" = 'rsvp.php' || { echo "::error::File not allowlisted"; exit 1; }

      - name: Checkout versioned source
        uses: actions/checkout@v4

      - name: Lint and validate release file
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          file="spaceweb-api-release/$TARGET"
          test -f "$file" || { echo "::error::No reviewed release file: $file"; exit 1; }
          test -s "$file" || { echo "::error::Release file empty"; exit 1; }
          php -l "$file"
          test "$(wc -c < "$file")" -lt 300000 || { echo "::error::Release too large"; exit 1; }

      - name: Upload with verification and in-run rollback
        env:
          FTP_USER: ${{ secrets.SPACEWEB_API_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SPACEWEB_API_FTP_PASSWORD }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          test -n "$FTP_USER" && test -n "$FTP_PASSWORD"
          # The server TLS certificate is for *.sweb.ru. The provider IP and
          # VH404 hostname were verified during the isolated FTPS tests.
          echo "77.222.40.70 vh404.sweb.ru" | sudo tee -a /etc/hosts >/dev/null
          python3 - <<'PY'
          import ftplib
          import io
          import os
          import ssl
          import sys
          import hashlib

          target = os.environ['TARGET']
          if target != 'rsvp.php':
              raise SystemExit('Target not allowed')
          source = open('spaceweb-api-release/' + target, 'rb').read()
          if not source or len(source) > 300_000:
              raise SystemExit('Invalid release size')
          ftp = ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=20)
          had_old = False
          old = None
          try:
              ftp.connect('vh404.sweb.ru', 21)
              ftp.login(os.environ['FTP_USER'], os.environ['FTP_PASSWORD'])
              ftp.prot_p()
              # The account is jailed to /public_html/api.
              ftp.pwd()
              old_chunks = []
              try:
                  ftp.retrbinary('RETR ' + target, old_chunks.append)
                  old = b''.join(old_chunks)
                  had_old = True
              except ftplib.error_perm as e:
                  if not str(e).startswith('550'):
                      raise
              # First deployment without an existing file is not allowed.
              if not had_old:
                  raise RuntimeError('Live PHP file missing. Initial install requires review.')
              if source == old:
                  print('No changes: file already matches source.')
                  sys.exit(0)
              print('Existing file copied into runner memory for rollback.')
              changed = False
              try:
                  changed = True
                  ftp.storbinary('STOR ' + target, io.BytesIO(source))
                  chunks = []
                  ftp.retrbinary('RETR ' + target, chunks.append)
                  remote = b''.join(chunks)
                  if hashlib.sha256(remote).digest() != hashlib.sha256(source).digest():
                      raise RuntimeError('Readback hash mismatch')
                  print('Deployment verified: hashes match.')
              except Exception:
                  if changed and old is not None:
                      try:
                          ftp.storbinary('STOR ' + target, io.BytesIO(old))
                          print('Rolled back prior file after upload error.')
                      except Exception as rollback_err:
                          print('CRITICAL: rollback failed:', type(rollback_err).__name__)
                  raise
          finally:
              try: ftp.quit()
              except Exception: ftp.close()
          PY

      - name: Success
        run: echo "PHP file updated and content verified. No other files touched."
