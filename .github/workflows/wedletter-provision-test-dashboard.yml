name: WEDLETTER | Create test dashboard access

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wedletter-spaceweb-api
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Provision test wedding access and remove one-time PHP probe
        env:
          FTP_USER: ${{ secrets.SPACEWEB_API_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SPACEWEB_API_FTP_PASSWORD }}
          TEST_TOKEN: ${{ secrets.WEDLETTER_TEST_DASHBOARD_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$FTP_USER" && test -n "$FTP_PASSWORD"
          if [[ ! "$TEST_TOKEN" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Set WEDLETTER_TEST_DASHBOARD_TOKEN to 64 lowercase hex characters in repository secrets."
            exit 1
          fi
          echo "77.222.40.70 vh404.sweb.ru" | sudo tee -a /etc/hosts >/dev/null
          python3 - <<'PY'
          import ftplib
          import hashlib
          import io
          import json
          import os
          import secrets
          import ssl
          import urllib.error
          import urllib.request

          proof=secrets.token_urlsafe(36)
          filename='wedletter_provision_'+secrets.token_hex(16)+'.php'
          template=open('tools/spaceweb-dashboard-provision.php','rb').read()
          assert template.count(b'__PROBE_HASH__')==1
          payload=template.replace(b'__PROBE_HASH__',hashlib.sha256(proof.encode()).hexdigest().encode())
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=20)
          ftp.connect('vh404.sweb.ru',21)
          ftp.login(os.environ['FTP_USER'],os.environ['FTP_PASSWORD'])
          ftp.prot_p()
          installed=False
          try:
              ftp.storbinary('STOR '+filename,io.BytesIO(payload))
              installed=True
              req=urllib.request.Request(
                  'https://wedletter.ru/api/'+filename,
                  headers={
                    'X-Wedletter-Probe':proof,
                    'X-Wedletter-Dashboard-Token':os.environ['TEST_TOKEN'],
                    'Cache-Control':'no-store'
                  },method='GET')
              try:
                  with urllib.request.urlopen(req,timeout=25) as response:
                      raw=response.read(4096)
              except urllib.error.HTTPError as e:
                  raw=e.read(4096)
              try: result=json.loads(raw)
              except ValueError: raise RuntimeError('Provision endpoint did not return JSON')
              if result.get('ok') is not True:
                  print('::error::Provision failed: '+str(result.get('code','unknown')))
                  raise RuntimeError('Access provisioning failed')
              print('Test access '+str(result.get('access','updated'))+' for '+str(result.get('wedding_slug','unknown'))+'. Token not logged.')
          finally:
              if installed:
                  try: ftp.delete(filename); print('Temporary provisioning endpoint removed.')
                  except Exception:
                      print('::error::Temporary provision PHP file could not be deleted. Remove wedletter_provision_*.php from /api immediately.')
                      raise
              try: ftp.quit()
              except Exception: ftp.close()
          PY
