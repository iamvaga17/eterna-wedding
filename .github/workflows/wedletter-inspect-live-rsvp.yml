name: WEDLETTER | Inspect RSVP slug validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wedletter-inspect-live-rsvp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read only relevant RSVP validation from live API
        env:
          FTP_USER: ${{ secrets.SPACEWEB_API_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SPACEWEB_API_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_USER" && test -n "$FTP_PASSWORD"
          echo "77.222.40.70 vh404.sweb.ru" | sudo tee -a /etc/hosts >/dev/null
          python3 - <<'PY'
          import ftplib,ssl,os,re
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=20)
          ftp.connect('vh404.sweb.ru',21)
          ftp.login(os.environ['FTP_USER'],os.environ['FTP_PASSWORD'])
          ftp.prot_p()
          chunks=[]
          try:
            ftp.retrbinary('RETR rsvp.php',chunks.append)
          finally:
            try:ftp.quit()
            except Exception:ftp.close()
          s=b''.join(chunks).decode('utf-8','replace').splitlines()
          print('RSVP PHP exists; total lines:',len(s))
          hit=[i for i,line in enumerate(s) if 'Неверный адрес свадьбы' in line]
          print('Occurrences of slug error:',len(hit))
          for i,line in enumerate(s):
            if ('function validSlug' in line or '$slug = (string)($_GET[' in line):
              print('SAFE VALIDATION LINE:', line.strip()[:220])
              if 'function validSlug' in line:
                for following in s[i+1:i+8]:
                  print('SAFE VALIDATION FOLLOWUP:',following.strip()[:220])

          for i in hit[:3]:
            for line in s[max(0,i-12):min(len(s),i+4)]:
              line=line.strip()
              # Never log raw values or full config. Print only whitelist of
              # safe input/validation syntax, with literals redacted except
              # known diagnostic text and parameter identifiers.
              if not re.search(r'(\$_GET|\$_POST|\$_SERVER|slug|wedding|preg_match|http_response_code|json_encode|REQUEST_URI|parse_url|error|fail|respond|badRequest)',line,re.I):
                continue
              line=re.sub(r'''(["'])(?:(?!\1).)*?\1''', '<literal>', line)
              print('  '+line[:200])
          PY
