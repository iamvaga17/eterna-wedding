name: WEDLETTER | Check editor v8 share links
on:
  push:
    branches: [main]
    paths:
      - 'editor-unified-spaceweb-v8.html'
      - '.github/workflows/wedletter-check-editor-v8.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JS and share link source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('editor-unified-spaceweb-v8.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s,re.I)
          assert scripts
          Path('/tmp/wedletter-v8.js').write_text('\n'.join(scripts))
          assert "renderShareLinks(p,slug)" in s
          assert "renderShareLinks($('publishResult'),publicationSlug())" in s
          assert "① Приглашение для гостей" in s
          assert "② Личный кабинет молодожёнов" in s
          assert "issueCabinetLink(slug,pass,'rotate')" in s
          assert "localStorage.setItem('wedletter-cabinet-link:'+slug,link)" in s
          assert "const files=await buildPublishFiles(id,slug,rsvpEndpoint);" in s
          assert "rsvpEndpoint=await registerWedding(slug,pass)" in s
          assert "renderCabinetLink(" not in s
          print('All share link and RSVP integration assertions passed.')
          PY
          node --check /tmp/wedletter-v8.js
