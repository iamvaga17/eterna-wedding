name: WEDLETTER | Check RSVP dashboard PHP

on:
  push:
    branches: [main]
    paths:
      - 'spaceweb-api-release/**'
      - '.github/workflows/wedletter-rsvp-php-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint RSVP dashboard PHP
        run: |
          set -euo pipefail
          php -l spaceweb-api-release/dashboard.php
          grep -q 'wedletter_dashboard_access' spaceweb-api-release/dashboard.php
          grep -q 'wedletter_rsvp_responses' spaceweb-api-release/dashboard.php
          echo 'PHP syntax and schema names checked. Not deployed.'
