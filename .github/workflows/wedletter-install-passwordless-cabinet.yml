name: WEDLETTER | Install passwordless cabinets

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type INSTALL CABINET to install 3 new cabinet files'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wedletter-spaceweb-api
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Require approval and validate PHP
        env:
          CONFIRM: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRM" = 'INSTALL CABINET' || { echo "::error::Confirmation missing"; exit 1; }
          php -l spaceweb-api-release/create-dashboard-access.php
          php -l spaceweb-api-release/cabinet-login.php
          test -s spaceweb-api-release/cabinet.html
          grep -q "location.hash" spaceweb-api-release/cabinet.html

      - name: Install new cabinet files via certificate-verified FTPS
        env:
          FTP_USER: ${{ secrets.SPACEWEB_API_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SPACEWEB_API_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_USER" && test -n "$FTP_PASSWORD"
          echo "77.222.40.70 vh404.sweb.ru" | sudo tee -a /etc/hosts >/dev/null
          python3 - <<'PY'
          import ftplib,hashlib,io,os,ssl

          names=['cabinet-login.php','create-dashboard-access.php','cabinet.html']
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=20)
          ftp.connect('vh404.sweb.ru',21)
          ftp.login(os.environ['FTP_USER'],os.environ['FTP_PASSWORD'])
          ftp.prot_p()
          uploaded=[]
          try:
            # Abort before writing anything if any of the exact target names exists.
            for name in names:
              try:
                ftp.retrbinary('RETR '+name,lambda chunk: None)
              except ftplib.error_perm as e:
                if not str(e).startswith('550'):raise
              else:
                raise RuntimeError('Refusing overwrite of existing '+name)
            try:
              for name in names:
                source=open('spaceweb-api-release/'+name,'rb').read()
                if not source or len(source)>300000:raise RuntimeError('Invalid release size for '+name)
                # Record before upload so even an interrupted upload can be cleaned up.
                uploaded.append(name)
                ftp.storbinary('STOR '+name,io.BytesIO(source))
                check=[]
                ftp.retrbinary('RETR '+name,check.append)
                if hashlib.sha256(b''.join(check)).digest()!=hashlib.sha256(source).digest():
                  raise RuntimeError('Readback integrity check failed for '+name)
                print('Verified new file:',name)
            except Exception:
              for name in reversed(uploaded):
                try:ftp.delete(name);print('Cleaned up:',name)
                except Exception:print('::error::Could not clean up failed new file '+name)
              raise
          finally:
            try:ftp.quit()
            except Exception:ftp.close()
          print('Passwordless cabinet installed; existing dashboard.php, rsvp.php and publish.php unchanged.')
          PY
