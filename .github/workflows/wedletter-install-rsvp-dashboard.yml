name: WEDLETTER | Install RSVP dashboard

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type INSTALL DASHBOARD to install a new dashboard.php'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wedletter-spaceweb-api
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Confirm and lint exact release
        env:
          CONFIRM: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRM" = "INSTALL DASHBOARD" || { echo "::error::No installation authorization"; exit 1; }
          php -l spaceweb-api-release/dashboard.php
          test "$(wc -c < spaceweb-api-release/dashboard.php)" -lt 300000

      - name: Install dashboard only if it does not exist
        env:
          FTP_USER: ${{ secrets.SPACEWEB_API_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SPACEWEB_API_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_USER" && test -n "$FTP_PASSWORD"
          echo "77.222.40.70 vh404.sweb.ru" | sudo tee -a /etc/hosts >/dev/null
          python3 - <<'PY'
          import ftplib
          import hashlib
          import io
          import os
          import ssl

          target = 'dashboard.php'
          body = open('spaceweb-api-release/' + target,'rb').read()
          ftp = ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=20)
          ftp.connect('vh404.sweb.ru',21)
          ftp.login(os.environ['FTP_USER'],os.environ['FTP_PASSWORD'])
          ftp.prot_p()
          uploaded=False
          try:
              try:
                  ftp.retrbinary('RETR '+target,lambda b: None)
              except ftplib.error_perm as e:
                  if not str(e).startswith('550'):
                      raise
              else:
                  raise RuntimeError('dashboard.php already exists on server. No overwrite allowed.')
              try:
                  uploaded=True
                  ftp.storbinary('STOR '+target,io.BytesIO(body))
                  readback=[]
                  ftp.retrbinary('RETR '+target,readback.append)
                  if hashlib.sha256(b''.join(readback)).digest()!=hashlib.sha256(body).digest():
                      raise RuntimeError('Verification mismatch')
                  print('dashboard.php installed and checked, other API files untouched.')
              except BaseException:
                  if uploaded:
                      try: ftp.delete(target); print('Removed failed new upload.')
                      except Exception as e: print('WARNING: automatic cleanup failed:',type(e).__name__)
                  raise
          finally:
              try: ftp.quit()
              except Exception: ftp.close()
          PY
