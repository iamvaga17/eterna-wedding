name: ÉTERNA mobile
on:
  push:
    branches: [codex/eterna-12]
  pull_request:
    paths:
      - 'eterna-12/**'
      - 'editor.html'
      - 'wedding-config.js'
      - 'rsvp-*.js'
      - '.github/workflows/eterna-mobile.yml'
permissions:
  contents: read
jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - run: npx playwright install --with-deps webkit
      - name: Check invitation in mobile WebKit
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 &
          server=$!
          trap 'kill "$server"' EXIT
          curl --fail --silent --retry 5 --retry-connrefused http://127.0.0.1:8080/eterna-12/ > /dev/null
          node eterna-12/qa/mobile.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eterna-mobile-screenshots
          path: screenshots/
