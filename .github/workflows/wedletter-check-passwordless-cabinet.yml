name: WEDLETTER | Check passwordless cabinet

on:
  push:
    branches: [main]
    paths:
      - 'spaceweb-api-release/cabinet-login.php'
      - 'spaceweb-api-release/create-dashboard-access.php'
      - 'spaceweb-api-release/cabinet.html'
      - 'editor-unified-spaceweb-v7.html','wedletter-dashboard-admin.html'
      - '.github/workflows/wedletter-check-passwordless-cabinet.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l spaceweb-api-release/cabinet-login.php
          php -l spaceweb-api-release/create-dashboard-access.php
      - name: Frontend JavaScript syntax and token exposure check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in ['spaceweb-api-release/cabinet.html','editor-unified-spaceweb-v7.html']:
            source=Path(name).read_text()
            scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',source,re.I)
            assert scripts, 'Missing inline JS: '+name
            dest='/tmp/'+Path(name).name+'.js'
            Path(dest).write_text('\n'.join(scripts))
            print(dest)
          s=Path('editor-unified-spaceweb-v7.html').read_text()
          assert "localStorage.setItem('wedletter-cabinet-link:'" in s
          assert 'renderCabinetLink(p,link,slug)' in s
          assert 'const files=await buildPublishFiles(id,slug,rsvpEndpoint);' in s
          assert 'cabinetLink' not in s[s.index('async function buildPublishFiles'):s.index('async function publishRequest')]
          PY
          node --check /tmp/cabinet.html.js
          node --check /tmp/editor-unified-spaceweb-v7.html.js
          node --check /tmp/wedletter-dashboard-admin.html.js
