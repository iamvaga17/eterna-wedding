name: WEDLETTER | Stage SpaceWeb updates

on:
  push:
    branches: [main]
    paths:
      - 'spaceweb-stage/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wedletter-spaceweb-stage
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check FTP secrets without printing values
        env:
          FTP_USER: ${{ secrets.SPACEWEB_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SPACEWEB_FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_USER" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Missing SPACEWEB_FTP_USER or SPACEWEB_FTP_PASSWORD"
            exit 1
          fi

      - name: Install FTPS client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload to isolated staging only
        env:
          FTP_USER: ${{ secrets.SPACEWEB_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SPACEWEB_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -f spaceweb-stage/.htaccess
          # Provider panel identifies the host as VH404 / 77.222.40.70.
          # The FTP service certificate covers *.sweb.ru.
          # TLS hostname and CA validation MUST remain enabled.
          echo "77.222.40.70 vh404.sweb.ru" | sudo tee -a /etc/hosts
          lftp -u "$FTP_USER","$FTP_PASSWORD" ftp://vh404.sweb.ru <<'LFTP'
          set cmd:fail-exit yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          set net:max-retries 1
          set net:timeout 20
          # Deny web access before transferring any staged payload.
          put spaceweb-stage/.htaccess -o .htaccess
          mirror -R --verbose --exclude-glob .htaccess --no-perms spaceweb-stage/ .
          bye
          LFTP

      - name: Done
        run: echo "Staged files only; no production files were installed or overwritten."
