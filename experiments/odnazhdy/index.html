lid #f9edd8;color:#14213e;border-radius:100px;font-size:13px;font-weight:700;box-shadow:0 10px 26px #0007}.tint{font-size:10px;letter-spacing:.15em;color:#f0ddbc}main{display:none}main.active{display:block}.top{position:fixed;inset:0 0 auto;z-index:20;padding:calc(14px + env(safe-area-inset-top)) 20px 16px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#071129f2,#07112900);pointer-events:none}.top>*{pointer-events:auto}.meter{width:78px;height:3px;border-radius:2px;background:#d5bf9954;overflow:hidden}.meter i{display:block;background:var(--gold);width:0;height:100%}.top button{background:#112241bb;border:1px solid #ffffff45;border-radius:100%;width:37px;height:37px;color:var(--gold);font-size:20px}.chapter{position:relative;min-height:112svh;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:110px 18px max(75px,11svh);isolation:isolate;overflow:hidden;text-align:center}.chapter .image{z-index:-3}.chapter .shade{z-index:-2;background:linear-gradient(180deg,#06122b08 0%,#06122b00 31%,#06122b8a 58%,#06112cf5 83%,#06112afa)}.storylabel{font-size:10px;letter-spacing:.23em;color:var(--gold);font-weight:700;margin-bottom:12px}.chapter h2{font:italic 500 clamp(45px,12.5vw,82px)/.89 'Cormorant Garamond',serif;margin:0 0 13px;text-shadow:0 4px 18px #000e;max-width:620px}.subtitle{font:400 22px/1.17 'Cormorant Garamond',serif;max-width:360px;margin:0 0 18px;text-shadow:0 3px 13px #000e}.panel{background:linear-gradient(170deg,#101d3ef7,#1c2e52f5);border:1px solid #f1d9a5c4;border-radius:26px;padding:23px 20px;width:min(100%,430px);box-shadow:0 17px 43px #000b}.panel p{font:400 22px/1.23 'Cormorant Garamond',serif;margin:8px 0}.names{font:italic 500 56px/1 'Cormorant Garamond',serif;color:var(--gold);margin:10px 0 12px}.smallcap{font-size:10px;letter-spacing:.16em;color:var(--gold)}.divider{height:1px;background:linear-gradient(90deg,transparent,#edd39a,transparent);margin:16px auto;width:75%}.reveal </style></head><body class="lock"><section id="intro" class="intro"><div class="image castle"></div><div class="shade"></div><div class="intro-body"><div class="brand">✦ WEDLETTER</div><div class="intro-text"><div class="eyebrow">Интерактивная свадебная сказка</div><h1>Однажды…</h1><p>Самые красивые истории начинаются с одного взгляда.</p><button id="start" class="goldbtn">Открыть нашу сказку ✧</button></div><div class="tint">ВОЛШЕБСТВО УЖЕ БЛИЗКО</div></div></section><main id="main"><header class="top"><div class="brand">WEDLETTER</div><div class="meter"><i id="meter"></i></div><button id="restart" aria-label="Вернуться к заставке">↶</button></header><div id="sections"></div></main><script>
const STORE='wedletter_fairytale_real_v5',initial={couple:'Алина & Матвей',date:'14 июня 2027',venue:'Усадьба «Сказка»',arrival:'16:00',colors:['#f0dcca','#deb9c4','#a3b5d2','#bc94ad','#b5aa99'],events:[{time:'15:30',name:'Сбор гостей',note:'Приветственные напитки'},{time:'16:00',name:'Свадебная церемония',note:'Наше самое главное «да»'},{time:'17:30',name:'Праздничный ужин',note:'Тёплые слова, музыка и танцы'},{time:'20:30',name:'Свадебный торт',note:'Сладкое завершение вечера'}],blocks:[{id:'story',type:'story',on:true,title:'Однажды два сердца встретились…',text:'И мир вдруг стал чуточку волшебнее.'},{id:'ball',type:'ball',on:true,title:'И целый мир закружился в танце',text:'Началась история, которую хочется прожить вместе.'},{id:'invite',type:'invite',on:true,title:'Карета уже отправляется…',text:'Приглашаем вас разделить с нами этот день.'},{id:'timing',type:'timing',on:true,title:'Программа волшебного дня',text:'Каждая минута нашей сказки особенна.'},{id:'dress',type:'dress',on:true,title:'Королевский дресс-код',text:'Поддержите атмосферу праздника нежными оттенками.'},{id:'notes',type:'notes',on:true,title:'Наши пожелания',text:'Самый главный подарок для нас — ваше присутствие.'},{id:'rsvp',type:'rsvp',on:true,title:'До встречи в нашей сказке',text:'Пожалуйста, подтвердите своё присутствие.'}]};
const clone=x=>JSON.parse(JSON.stringify(x));let settings=clone(initial);try{let x=JSON.parse(localStorage.getItem(STORE)||'null');if(x&&Array.isArray(x.blocks))settings=x}catch(e){}const esc=x=>String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));
function section(b){const a={story:'castle',ball:'ball',invite:'coach',timing:'garden',dress:'ball',notes:'garden',rsvp:'castle'};let inner='';if(b.type==='story')inner='<div class="smallcap">НАША ИСТОРИЯ</div><div class="names">'+esc(settings.couple)+'</div><div class="divider"></div><p>Самая красивая сказка — та, которую пишут вдвоём.</p>';else if(b.type==='ball')inner='<div class="smallcap">КОРОЛЕВСКИЙ БАЛ</div><div class="names">Приглашаем вас</div><div class="divider"></div><p>Вечер, где сбудется ещё одна мечта.</p>';else if(b.type==='invite')inner='<div class="smallcap">ДАТА НАШЕГО ПРАЗДНИКА</div><div class="names" style="font-size:44px">'+esc(settings.date)+'</div><div class="divider"></div><div class="data"><div><small>ГДЕ</small><b>'+esc(settings.venue)+'</b></div><div><small>КОГДА</small><b>Сбор в '+esc(settings.arrival)+'</b></div></div>';else if(b.type==='timing')inner='<div class="smallcap">РАСПИСАНИЕ КОРОЛЕВСКОГО БАЛА</div>'+settings.events.map(e=>'<div class="event"><time>'+esc(e.time)+'</time><div><b>'+esc(e.name)+'</b><span>'+esc(e.note)+'</span></div></div>').join('');else if(b.type==='dress')inner='<div class="smallcap">ЦВЕТА НАШЕГО ВЕЧЕРА</div><div class="swatches">'+settings.colors.map(c=>'<i style="background:'+(/^#[0-9a-f]{6}$/i.test(c)?c:'#e4d3be')+'"></i>').join('')+'</div><div class="divider"></div><p>Будем рады видеть вас в нарядах этих оттенков.</p>';else if(b.type==='notes')inner='<div class="smallcap">ПОСЛАНИЕ ГОСТЯМ</div><p>'+esc(b.text)+'</p><div class="divider"></div><div style="font:italic 40px Georgia">♡</div>';else if(b.type==='rsvp')inner='<div class="smallcap">ВОЛШЕБНОЕ ПИСЬМО</div><p>Подтвердите участие в нашем празднике</p><form id="rsvpForm"><label for="guestName">Ваше имя</label><input id="guestName" type="text" placeholder="Как к вам обращаться?" required><div class="answers"><label><input type="radio" name="attendance" value="yes" checked> Я буду</label><label><input type="radio" name="attendance" value="no"> Не смогу</label></div><button class="goldbtn">Отправить ответ ♡</button><div class="rsvp-note" id="rsvpNote">Демоверсия: ответ не отправляется на сервер.</div></form>';
return '<section class="chapter" data-type="'+esc(b.type)+'"><div class="image '+(a[b.type]||'garden')+'"></div><div class="shade"></div><div class="storylabel reveal">'+({story:'Глава первая',ball:'Глава вторая',invite:'Приглашение',timing:'Тайминг дня',dress:'Дресс-код',notes:'Пожелания',rsvp:'Эпилог'}[b.type]||'Новая глава')+'</div><h2 class="reveal">'+esc(b.title)+'</h2><p class="subtitle reveal">'+esc(b.text)+'</p><div class="'+(b.type==='rsvp'?'rsvp-paper':'panel')+' reveal">'+inner+'</div><div class="scroll reveal">'+(b.type==='rsvp'?'WEDLETTER ♡':'ЛИСТАЙТЕ ДАЛЬШЕ ↓')+'</div></section>'}
function render(){document.getElementById('sections').innerHTML=settings.blocks.filter(b=>b.on).map(section).join('');let ob=new IntersectionObserver(items=>items.forEach(item=>{if(item.isIntersecting)item.target.querySelectorAll('.reveal').forEach((n,i)=>setTimeout(()=>n.classList.add('visible'),i*140))}),{threshold:.08});document.querySelectorAll('.chapter').forEach(s=>ob.observe(s));document.getElementById('rsvpForm')?.addEventListener('submit',e=>{e.preventDefault();document.getElementById('rsvpNote').textContent='Спасибо! Это демонстрационная форма, данные не сохранены.'})}
render();document.getElementById('start').onclick=()=>{document.querySelector('#intro').classList.add('gone');document.querySelector('main').classList.add('active');document.body.classList.remove('lock');window.scrollTo(0,0);setTimeout(()=>document.querySelectorAll('.chapter:first-child .reveal').forEach((e,i)=>setTimeout(()=>e.classList.add('visible'),i*160)),120)};document.getElementById('restart').onclick=()=>location.reload();window.addEventListener('scroll',()=>{let max=document.documentElement.scrollHeight-innerHeight;document.querySelector('#meter').style.width=Math.max(0,Math.min(100,max?scrollY/max*100:0))+'%'},{passive:true});
</script></body></html>
