<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Редактор «ОДНАЖДЫ» V8 — WEDLETTER</title><style>*{box-sizing:border-box}body{margin:0;background:#08142e;color:#f6e3b6;font:14px Arial,sans-serif}header{padding:20px;border-bottom:1px solid #f0d9a444;font-family:Georgia,serif;font-size:23px}main{display:grid;grid-template-columns:minmax(0,580px) 1fr;min-height:90vh}.editor{padding:18px;max-width:580px}.preview{position:sticky;top:0;height:100vh;display:grid;place-items:center;background:#101d3a}.preview iframe{width:350px;max-width:90%;height:85vh;border:8px solid #27385d;border-radius:32px;background:#10152c}.group{background:#17264b;border:1px solid #bda57b6a;border-radius:15px;padding:18px;margin:12px 0}.group h2{font:24px Georgia,serif;margin:3px 0 16px}label{display:block;margin:12px 0;font-size:13px}input:not([type=checkbox]):not([type=color]),textarea,select{width:100%;padding:10px;margin-top:6px;border-radius:7px;border:1px solid #bda57b70;background:#091732;color:#fff4d9;font:14px Arial}.block{background:#0c1b3a;padding:15px;border-radius:12px;margin-bottom:12px;border:1px solid #dcbf8a44}.block-title{display:flex;align-items:center;justify-content:space-between;gap:8px}.actions{display:flex;gap:6px;margin:12px 0}button{background:#e9cf9b;border:0;color:#14203a;border-radius:9px;padding:10px 12px;font-weight:bold;cursor:pointer}button.secondary{background:#344970;color:#f3e8d8;border:1px solid #d8bc8969}button:disabled{opacity:.35}.row{display:grid;grid-template-columns:85px 1fr auto;gap:8px;align-items:center;margin:10px 0}.row input{min-width:0}.colors{display:flex;flex-wrap:wrap;gap:12px}.colors input{width:52px;height:42px}.notice{color:#cfc9d1;line-height:1.6;font-size:12px}@media(max-width:850px){main{display:block}.preview{position:relative;height:650px;margin:20px;border-radius:20px}.preview iframe{height:600px}}
</style></head><body><header>WEDLETTER · РЕДАКТОР «ОДНАЖДЫ»</header><main><section class="editor"><p class="notice">Тестовый редактор. Настройки сохраняются только в этом браузере. Для гостей изменения пока не публикуются, RSVP демонстрационный.</p><div class="group"><h2>Данные пары</h2><div id="fields"></div></div><div class="group"><h2>Порядок блоков</h2><div id="blocks"></div><select id="type"></select> <button id="add">+ Добавить блок</button></div><div class="group"><h2>Тайминг дня</h2><div id="events"></div><button id="addEvent">+ Событие</button></div><div class="group"><h2>Дресс-код</h2><div class="colors" id="colors"></div><button id="addColor">+ Цвет</button></div><button id="reset" class="secondary">Сбросить настройки</button> <button id="open">Открыть сайт ↗</button></section><aside class="preview"><iframe src="./index.html?v=9" id="frame" title="Предпросмотр"></iframe></aside></main><script>
const KEY='wedletter_fairytale_real_v9';let c=JSON.parse(localStorage.getItem(KEY)||'null');const defaults={couple:'Алина & Матвей',date:'14 июня 2027',venue:'Усадьба «Сказка»',arrival:'16:00',colors:['#f0dcca','#deb9c4','#a3b5d2','#bc94ad','#b5aa99'],events:[{time:'15:30',name:'Сбор гостей',note:'Приветственные напитки'},{time:'16:00',name:'Свадебная церемония',note:'Наше самое главное «да»'},{time:'17:30',name:'Праздничный ужин',note:'Музыка и танцы'},{time:'20:30',name:'Свадебный торт',note:'Сладкий финал вечера'}],blocks:[{id:'story',type:'story',on:true,title:'Однажды два сердца встретились…',text:'И мир вдруг стал чуточку волшебнее.'},{id:'ball',type:'ball',on:true,title:'И целый мир закружился в танце',text:'Началась история, которую хочется прожить вместе.'},{id:'invite',type:'invite',on:true,title:'Карета уже отправляется…',text:'Приглашаем вас разделить с нами этот день.'},{id:'timing',type:'timing',on:true,title:'Программа волшебного дня',text:'Каждая минута нашей сказки особенна.'},{id:'dress',type:'dress',on:true,title:'Королевский дресс-код',text:'Поддержите атмосферу праздника нежными оттенками.'},{id:'notes',type:'notes',on:true,title:'Наши пожелания',text:'Самый главный подарок — ваше присутствие.'},{id:'rsvp',type:'rsvp',on:true,title:'До встречи в нашей сказке',text:'Пожалуйста, подтвердите своё присутствие.'}]};if(!c||!Array.isArray(c.blocks))c=structuredClone(defaults);const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[a]));let types={story:'История',ball:'Бал',invite:'Приглашение',timing:'Тайминг',dress:'Дресс-код',notes:'Пожелания',rsvp:'RSVP'};function refresh(){ $('fields').innerHTML=['couple','date','venue','arrival'].map(k=>'<label>'+({couple:'Имена',date:'Дата',venue:'Место',arrival:'Время сбора'}[k])+'<input data-field="'+k+'" value="'+esc(c[k])+'"></label>').join('');$('blocks').innerHTML=c.blocks.map((b,i)=>'<div class="block"><div class="block-title"><strong>'+types[b.type]+'</strong><label><input type="checkbox" data-toggle="'+i+'" '+(b.on?'checked':'')+'> Включён</label></div><div class="actions"><button class="secondary" data-up="'+i+'" '+(i===0?'disabled':'')+'>↑</button><button class="secondary" data-down="'+i+'" '+(i===c.blocks.length-1?'disabled':'')+'>↓</button><button class="secondary" data-remove="'+i+'">Удалить</button></div><label>Заголовок<input data-title="'+i+'" value="'+esc(b.title)+'"></label><label>Описание<textarea data-text="'+i+'">'+esc(b.text)+'</textarea></label></div>').join('');$('events').innerHTML=c.events.map((e,i)=>'<div class="row"><input data-event="'+i+'" data-prop="time" value="'+esc(e.time)+'"><input data-event="'+i+'" data-prop="name" value="'+esc(e.name)+'"><button class="secondary" data-del-event="'+i+'">×</button></div><label>Описание<textarea data-event="'+i+'" data-prop="note">'+esc(e.note)+'</textarea></label>').join('');$('colors').innerHTML=c.colors.map((v,i)=>'<div><input type="color" data-color="'+i+'" value="'+v+'"><button class="secondary" data-del-color="'+i+'">×</button></div>').join('');$('type').innerHTML=Object.entries(types).map(([id,label])=>'<option value="'+id+'">'+label+'</option>').join('')}function save(){localStorage.setItem(KEY,JSON.stringify(c));$('frame').src='./index.html?preview='+Date.now()}document.body.addEventListener('change',e=>{let t=e.target.dataset;if(t.field)c[t.field]=e.target.value;if(t.title)c.blocks[+t.title].title=e.target.value;if(t.text)c.blocks[+t.text].text=e.target.value;if(t.toggle!==undefined)c.blocks[+t.toggle].on=e.target.checked;if(t.event!==undefined)c.events[+t.event][t.prop]=e.target.value;if(t.color!==undefined)c.colors[+t.color]=e.target.value;save()});document.body.addEventListener('click',e=>{let t=e.target.dataset;if(t.up!==undefined){let i=+t.up;if(i)[c.blocks[i],c.blocks[i-1]]=[c.blocks[i-1],c.blocks[i]]}else if(t.down!==undefined){let i=+t.down;if(i<c.blocks.length-1)[c.blocks[i],c.blocks[i+1]]=[c.blocks[i+1],c.blocks[i]]}else if(t.remove!==undefined)c.blocks.splice(+t.remove,1);else if(t.delEvent!==undefined)c.events.splice(+t.delEvent,1);else if(t.delColor!==undefined)c.colors.splice(+t.delColor,1);else return;refresh();save()});$('add').onclick=()=>{let type=$('type').value,b=structuredClone(defaults.blocks.find(x=>x.type===type));b.id=type+'-'+Date.now();c.blocks.push(b);refresh();save()};$('addEvent').onclick=()=>{c.events.push({time:'19:00',name:'Новое событие',note:'Описание'});refresh();save()};$('addColor').onclick=()=>{c.colors.push('#f0dcca');refresh();save()};$('reset').onclick=()=>{if(confirm('Сбросить все настройки?')){c=structuredClone(defaults);refresh();save()}};$('open').onclick=()=>window.open('./index.html','_blank');refresh();
</script></body></html>
