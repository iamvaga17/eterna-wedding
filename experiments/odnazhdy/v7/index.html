</style></head><body class="lock"><section id="intro" class="intro"><div class="image castle"></div><div class="shade"></div><div class="intro-body"><div class="brand">✦ WEDLETTER</div><div class="intro-text"><div class="eyebrow">Интерактивная свадебная сказка</div><h1>Однажды…</h1><p>Самые красивые истории начинаются с одного взгляда.</p><button id="start" class="goldbtn">Открыть нашу сказку ✧</button></div><div class="tint">ВОЛШЕБСТВО УЖЕ БЛИЗКО</div></div></section><main id="main"><header class="top"><div class="brand">WEDLETTER</div><div class="meter"><i id="meter"></i></div><button id="restart" aria-label="Вернуться к заставке">↶</button></header><div id="sections"></div></main><script>
const STORE='wedletter_fairytale_real_v7',initial={couple:'Алина & Матвей',date:'14 июня 2027',venue:'Усадьба «Сказка»',arrival:'16:00',colors:['#f0dcca','#deb9c4','#a3b5d2','#bc94ad','#b5aa99'],events:[{time:'15:30',name:'Сбор гостей',note:'Приветственные напитки'},{time:'16:00',name:'Свадебная церемония',note:'Наше самое главное «да»'},{time:'17:30',name:'Праздничный ужин',note:'Тёплые слова, музыка и танцы'},{time:'20:30',name:'Свадебный торт',note:'Сладкое завершение вечера'}],blocks:[{id:'story',type:'story',on:true,title:'Однажды два сердца встретились…',text:'И мир вдруг стал чуточку волшебнее.'},{id:'ball',type:'ball',on:true,title:'И целый мир закружился в танце',text:'Началась история, которую хочется прожить вместе.'},{id:'invite',type:'invite',on:true,title:'Карета уже отправляется…',text:'Приглашаем вас разделить с нами этот день.'},{id:'timing',type:'timing',on:true,title:'Программа волшебного дня',text:'Каждая минута нашей сказки особенна.'},{id:'dress',type:'dress',on:true,title:'Королевский дресс-код',text:'Поддержите атмосферу праздника нежными оттенками.'},{id:'notes',type:'notes',on:true,title:'Наши пожелания',text:'Самый главный подарок для нас — ваше присутствие.'},{id:'rsvp',type:'rsvp',on:true,title:'До встречи в нашей сказке',text:'Пожалуйста, подтвердите своё присутствие.'}]};
const clone=x=>JSON.parse(JSON.stringify(x));let settings=clone(initial);try{let x=JSON.parse(localStorage.getItem(STORE)||'null');if(x&&Array.isArray(x.blocks))settings=x}catch(e){}const esc=x=>String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));
