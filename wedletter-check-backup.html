<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WEDLETTER · Проверка копии</title><style>body{margin:0;padding:24px;background:#f7f3ed;color:#302b26;font:16px/1.5 -apple-system,system-ui,sans-serif}main{max-width:620px;margin:auto}h1{font:clamp(34px,9vw,48px)/1.1 Georgia,serif}section{padding:21px;border:1px solid #ddd3c9;border-radius:18px;background:white}label{display:block;font-weight:600;margin:12px 0 6px}input{box-sizing:border-box;width:100%;padding:13px;font-size:16px;border-radius:10px;border:1px solid #cfc6bc}button{width:100%;padding:15px;background:#332c26;color:#fff;border:0;border-radius:11px;margin:17px 0;font-size:16px}p{color:#6b6158}#out{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#796f65}a{color:#463b32}</style><main><h1>Проверка серверной копии</h1><p>Проверяет сохранённые данные на SpaceWeb, ничего не меняя в редакторе и на сервере.</p><section><label for="id">ID тестового заказа</label><input id="id" value="test-rezervnoi-kopii" autocomplete="off"><label for="key">Ключ SpaceWeb</label><input id="key" type="password" autocomplete="off"><button id="check">Проверить копию</button><div id="out"></div></section><p><small>Ключ отправляется только на wedletter.ru/api/backup.php. Не передавай его в чат.</small></p><p><a href="editor-unified-spaceweb-v16.html">Редактор v16</a></p></main><script>
(()=>{
const out=document.getElementById('out');
document.getElementById('check').onclick=async()=>{
const id=document.getElementById('id').value.trim(),token=document.getElementById('key').value.trim();
if(!/^[a-z0-9](?:[a-z0-9-]{0,58}[a-z0-9])?$/.test(id)||!token){out.textContent='Проверь ID и введи ключ.';return}
out.textContent='Читаю серверную копию…';
const api=async(action)=>{const r=await fetch('https://wedletter.ru/api/backup.php',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({action,orderId:id}),cache:'no-store'});const x=await r.json().catch(()=>({}));if(!r.ok||x.ok!==true)throw Error(x.error||'HTTP '+r.status);return x};
try{
const [state,restored]=await Promise.all([api('status'),api('restore')]);
const c=restored.backup?.config||{};
const photos=Object.keys(state.mediaHashes||{});
out.textContent='Копия найдена.\nСохранена: '+(state.savedAt||'дата неизвестна')+'\nИмя жениха в копии: '+(c.couple?.first||'не указано')+'\nИмя невесты: '+(c.couple?.second||'не указано')+'\nМедиафайлов в копии: '+photos.length+'\n\nНикаких изменений не внесено.';
}catch(e){out.textContent='Не удалось проверить: '+e.message}
};
})();
</script>
