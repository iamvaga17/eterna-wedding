<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061127"><meta name="description" content="WEDLETTER — Midnight Sapphire, свадебная сцена"><title>Аурелия и Себастьян — Midnight Sapphire | WEDLETTER</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#061025}body{overflow-x:hidden;color:#fff}
.stage{position:relative;width:100%;height:100svh;height:100dvh;overflow:hidden;background:#070d1d;isolation:isolate}
.art{position:absolute;inset:0;background:#070d1d url("assets/sapphire.jpg") center/cover no-repeat;transform:translateZ(0) scale(1.018);animation:arrival 4s ease-out both}
@keyframes arrival{from{opacity:.45;transform:scale(1.05)}to{opacity:1;transform:scale(1.018)}}
.stars{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:2}
.star{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);border-radius:50%;background:var(--c);opacity:.5;animation:twinkle var(--t) ease-in-out var(--delay) infinite alternate}
@keyframes twinkle{0%{opacity:.1;transform:translate3d(0,4px,0) scale(.65)}55%{opacity:.95;transform:translate3d(1px,-3px,0) scale(1.2)}100%{opacity:.3;transform:translate3d(3px,-8px,0) scale(.75)}}
.veil{position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(ellipse at 48% 43%,#f4d7a3 0%,#bc975f 38%,#745a48 76%,#222a3b 100%);animation:veil-fade 4.7s cubic-bezier(.35,0,.42,1) .15s both}
@keyframes veil-fade{0%,30%{opacity:1}68%{opacity:.77}100%{opacity:0}}
.intro{position:absolute;inset:0;z-index:5;pointer-events:none;overflow:hidden;animation:intro-fade 4.8s cubic-bezier(.32,0,.4,1) .1s both}
@keyframes intro-fade{0%,28%{opacity:1}70%{opacity:.86}100%{opacity:0}}
/* Full-coverage golden microglitter: dense tiled highlights above an opaque illuminated veil. */
.intro:before{content:"";position:absolute;inset:-2%;background-color:#c7a16e;background-image:
radial-gradient(circle at 30% 25%,#fffef0 0 1.2px,#ffe0a1 1.8px,transparent 3px),
radial-gradient(circle at 70% 73%,#fff8d8 0 1px,#f2bd70 2px,transparent 3.8px),
radial-gradient(circle at 12% 80%,#ffebbe 0 1.5px,transparent 3.2px),
radial-gradient(circle at 85% 12%,#fffaf2 0 .9px,transparent 2.6px),
repeating-conic-gradient(from 24deg at 50% 50%,#fff0c2 0deg 20deg,#9d764c 30deg 44deg,#e0b77c 51deg 74deg,#ffe7b5 88deg 101deg,#b38752 116deg 139deg);
background-size:9px 11px,13px 15px,17px 13px,11px 19px,7px 9px;
background-position:0 0,4px 8px,8px 3px,7px 14px,0 0;
animation:microshimmer 1.35s ease-in-out infinite alternate;will-change:opacity}
.intro:after{content:"";position:absolute;inset:0;pointer-events:none;
background:radial-gradient(ellipse at 30% 40%,#fff6de77 0%,transparent 50%),radial-gradient(ellipse at 72% 60%,#fff9e877 0%,transparent 45%);
mix-blend-mode:screen;animation:glow-sweep 2.2s ease-in-out infinite alternate}
@keyframes microshimmer{from{opacity:.78}to{opacity:1}}
@keyframes glow-sweep{from{opacity:.35;transform:translate3d(-2%,1%,0)}to{opacity:.85;transform:translate3d(2%,-1%,0)}}
.intro .point{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);background:var(--c);border-radius:50%;box-shadow:0 0 5px #ffe2bb;animation:twinkle var(--t) ease-in-out var(--delay) infinite alternate}
.replay{position:absolute;z-index:8;right:calc(16px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));height:44px;width:44px;display:grid;place-items:center;border-radius:50%;border:1px solid #e8d5bd88;background:#09142999;color:#f7e9d4;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.replay svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stage.restart .veil,.stage.restart .intro,.stage.restart .art{animation:none!important}
@media(min-aspect-ratio:10/14){.art{background-size:contain;background-color:#071023}}
@media(prefers-reduced-motion:reduce){.veil,.intro{display:none}.art,.star{animation:none}}
</style></head><body><main class="stage" id="stage" aria-label="Свадебная сцена Аурелии и Себастьяна в сапфировых оттенках"><div class="art" role="img" aria-label="Аурелия и Себастьян на сцене под золотыми лучами"></div><div class="stars" id="stars" aria-hidden="true"></div><div class="veil" aria-hidden="true"></div><div class="intro" id="intro" aria-hidden="true"></div><button class="replay" id="replay" type="button" aria-label="Повторить мерцающее вступление"><svg viewBox="0 0 24 24"><path d="M3.7 10a8.3 8.3 0 1 1 .8 6M3 4v6h6"/></svg></button></main>
<script>(()=>{'use strict';let seed=2941;const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};const mobile=matchMedia('(max-width:600px)').matches;function generate(id,count){const el=document.getElementById(id),f=document.createDocumentFragment();for(let i=0;i<count;i++){const n=document.createElement('i');n.className=id==='intro'?'point':'star';n.style.setProperty('--x',(rand()*100).toFixed(2)+'%');n.style.setProperty('--y',(rand()*100).toFixed(2)+'%');n.style.setProperty('--s',(.7+rand()*2.5).toFixed(2)+'px');n.style.setProperty('--t',(1.4+rand()*2.9).toFixed(2)+'s');n.style.setProperty('--delay',(-rand()*5).toFixed(2)+'s');n.style.setProperty('--c',i%6===0?'#ffe3b0':'#fff1d7');f.appendChild(n)}el.appendChild(f)}generate('stars',mobile?44:70);generate('intro',mobile?230:340);const stage=document.getElementById('stage');document.getElementById('replay').addEventListener('click',()=>{stage.classList.add('restart');void stage.offsetWidth;stage.classList.remove('restart')})})();</script></body></html>
